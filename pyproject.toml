[project]
name = "rfnbo"
version = "0.1.0"
description = "RFNBO GHG and mass balance optimiser (retrospective accounting per EU 2023/1184 and 2023/1185)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "highspy>=1.11,<2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pydantic>=2.9,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# The block flow diagram editor. The engine never imports it.
ui = ["nicegui>=3.18,<4"]

[project.scripts]
rfnbo = "rfnbo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-openpyxl>=3.1.5.20260827",
    "playwright>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfnbo"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Ambiguous unicode (₂, ≤) is intentional in domain docstrings.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["rfnbo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: browser end-to-end tests (need the ui extra and Chromium)"]
pythonpath = ["."]

[[tool.mypy.overrides]]
# The highspy bindings are untyped; only the LP wrapper calls them.
module = ["rfnbo.optimise.lp"]
disallow_untyped_calls = false
